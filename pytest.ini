[pytest]
# Default run: mocked unit tests + local integration tests. No network, no paid calls.
# Live provider tests are opt-in: LIVE_TESTS=1 pytest tests/live
testpaths = tests/unit tests/integration
markers =
    live: calls real provider APIs with your credentials (opt-in, may cost money)
    slow: runs local heavy tools such as Blender
filterwarnings =
    ignore::DeprecationWarning
